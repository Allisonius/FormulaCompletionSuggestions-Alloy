plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'java'
    id 'antlr'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.jsonrpc:0.21.0'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j:0.21.0'
    implementation 'org.eclipse.lsp4j:org.eclipse.lsp4j.websocket.jakarta:0.21.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation "com.google.guava:guava:33.4.8-jre"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.0'
    testImplementation 'org.hamcrest:hamcrest:2.2'

    implementation 'org.slf4j:slf4j-simple:1.7.36'
    implementation 'commons-cli:commons-cli:1.4'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation("ch.qos.logback:logback-classic:1.5.18")
    
//    // This dependency is used by the application.
//    implementation 'com.google.guava:guava:31.1-jre'
//    // Jar lib for alloy
    implementation files('libs/org.alloytools.alloy.dist.jar')
//    implementation files('libs/AlloyParser.jar')
    implementation files('libs/aparser-1.0.jar')

//    implementation project(':AlloyParser')

    antlr "org.antlr:antlr4:4.9.3"
    implementation "org.antlr:antlr4-runtime:4.9.3"
}

//application {
//    // Define the main class for the application.
//    mainClass = 'alloy.language.server.ServerApplication'
//}

application {
    // Define the main class for the application.
    mainClass = 'alloy.language.server.ServerApplication'
}

configurations {
    compile {
        extendsFrom = extendsFrom.findAll { it != configurations.antlr }
    }
}

generateGrammarSource {
    maxHeapSize = "128m"
    arguments += ['-package', 'alloy.language.server', '-visitor', '-no-listener']
}

compileJava.dependsOn generateGrammarSource

sourceSets {
    generated {
        java.srcDir 'generated-src/antlr/main/'
    }
}

compileJava.source sourceSets.generated.java, sourceSets.main.java

clean{
    delete "generated-src"
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes(
                'Main-Class': 'alloy.language.server.ServerApplication'
        )
    }

    doFirst {
        from {
            configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
        }
    }
    exclude 'META-INF/*.RSA', 'META-INF/*.SF','META-INF/*.DSA'
}

test {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
